<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div class="pagina-login">
    <div class="login-caixa">
      <div class="login-marca" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12.55a11 11 0 0114.08 0M1.42 9a16 16 0 0121.16 0M8.53 16.11a6 6 0 016.95 0M12 20h.01"/>
        </svg>
      </div>
      <h1 class="login-titulo">Sistema</h1>
      <p class="login-subtitulo">Suporte técnico — acesse com sua conta</p>

      <div id="form-erro" class="form-erro" role="alert"></div>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">Login</label>
          <input type="text" id="email" name="email" autocomplete="username" placeholder="ex: joao.silva" required>
          <div class="campo-ajuda">Se seu login não tiver "@", completamos com @sistema.local automaticamente.</div>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="current-password" required>
        </div>
        <button type="submit" id="botao-entrar" class="botao botao-primario botao-bloco">Entrar</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const formErro = document.getElementById('form-erro');

    function exibirErroFormulario(mensagem) {
      formErro.textContent = mensagem;
      formErro.classList.add('visivel');
    }

    (async () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('erro') === 'inativo') {
        exibirErroFormulario('Sua conta está inativa. Procure um administrador do sistema.');
      }
      await redirecionarSeLogado();
    })();

    document.getElementById('form-login').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      formErro.classList.remove('visivel');

      let email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const botao = document.getElementById('botao-entrar');

      if (!email || !senha) {
        exibirErroFormulario('Preencha o login e a senha.');
        return;
      }

      // Login sem "@" (ex: "joao.silva") é completado com o domínio interno.
      if (!email.includes('@')) {
        email = `${email}@${DOMINIO_LOGIN_GERADO}`;
      }

      definirCarregando(botao, true, 'Entrando...');
      try {
        await fazerLogin(email, senha);
        const usuario = await buscarPerfilLogado();

        if (!usuario) {
          throw new Error('Seu login foi validado, mas não há um perfil cadastrado para esta conta. Procure um administrador.');
        }
        if (!usuario.ativo) {
          await supabaseClient.auth.signOut();
          throw new Error('Sua conta está inativa. Procure um administrador do sistema.');
        }

        window.location.href = usuario.precisa_trocar_senha
          ? 'trocar-senha.html'
          : (PAGINA_POR_PERFIL[usuario.perfil] || 'login.html');
      } catch (erro) {
        exibirErroFormulario(traduzirErro(erro));
      } finally {
        definirCarregando(botao, false);
      }
    });
  </script>
</body>
</html>
