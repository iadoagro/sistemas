<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body class="pagina">
  <header id="navbar" class="navbar"></header>

  <main class="conteudo">
    <div class="cabecalho-pagina">
      <div>
        <h1>Dashboard</h1>
        <p>Visão geral do sistema de chamados.</p>
      </div>
      <div class="acoes-topo">
        <a href="abrir-chamado.html" class="botao botao-primario">+ Abrir chamado</a>
      </div>
    </div>

    <div id="area-kpis" class="grade-kpi">
      <div class="carregando-pagina"><span class="spinner" aria-hidden="true"></span><span>Carregando indicadores...</span></div>
    </div>

    <div class="grade-2">
      <div class="cartao">
        <h2>Chamados por status</h2>
        <hr class="divisor">
        <div id="grafico-status"></div>
      </div>
      <div class="cartao">
        <h2>Chamados por prioridade</h2>
        <hr class="divisor">
        <div id="grafico-prioridade"></div>
      </div>
    </div>

    <div class="cartao">
      <h2>Carga de trabalho por técnico</h2>
      <hr class="divisor">
      <div id="tabela-tecnicos"></div>
    </div>

    <div class="cartao">
      <div class="cabecalho-pagina" style="margin-bottom: 12px;">
        <h2>Todos os chamados</h2>
      </div>
      <div class="barra-filtros">
        <input type="search" id="filtro-busca" placeholder="Buscar por título, cliente ou descrição...">
        <select id="filtro-status"><option value="">Todos os status</option></select>
        <select id="filtro-prioridade"><option value="">Todas as prioridades</option></select>
      </div>
      <div id="lista-chamados">
        <div class="carregando-pagina"><span class="spinner" aria-hidden="true"></span><span>Carregando chamados...</span></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chamados.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    async function carregarIndicadores() {
      try {
        const chamados = await carregarChamadosParaDashboard();
        const indicadores = calcularIndicadores(chamados);

        renderizarKpis(document.getElementById('area-kpis'), indicadores);
        renderizarGraficoBarras(document.getElementById('grafico-status'), indicadores.totais, CORES_STATUS, ROTULOS_STATUS);
        renderizarGraficoBarras(document.getElementById('grafico-prioridade'), indicadores.porPrioridade, CORES_PRIORIDADE, ROTULOS_PRIORIDADE);
        renderizarCargaTecnicos(document.getElementById('tabela-tecnicos'), indicadores.porTecnico);
      } catch (erro) {
        mostrarErro(traduzirErro(erro));
      }
    }

    const containerLista = document.getElementById('lista-chamados');
    const filtroBusca = document.getElementById('filtro-busca');
    const filtroStatus = document.getElementById('filtro-status');
    const filtroPrioridade = document.getElementById('filtro-prioridade');
    let temporizadorBusca = null;

    async function carregarLista() {
      containerLista.innerHTML = '<div class="carregando-pagina"><span class="spinner" aria-hidden="true"></span><span>Carregando chamados...</span></div>';
      try {
        const chamados = await listarChamados({
          busca: filtroBusca.value,
          status: filtroStatus.value,
          prioridade: filtroPrioridade.value
        });
        renderizarTabelaChamados(containerLista, chamados, { mensagemVazia: 'Nenhum chamado encontrado com os filtros atuais.' });
      } catch (erro) {
        mostrarErro(traduzirErro(erro));
        renderizarVazio(containerLista, 'Não foi possível carregar os chamados.');
      }
    }

    (async () => {
      const usuario = await exigirAutenticacao(['admin']);
      if (!usuario) return;
      renderizarNavbar(usuario, 'dashboard');

      STATUS_CHAMADO.forEach(s => filtroStatus.add(new Option(s.rotulo, s.valor)));
      PRIORIDADES_CHAMADO.forEach(p => filtroPrioridade.add(new Option(p.rotulo, p.valor)));

      await Promise.all([carregarIndicadores(), carregarLista()]);
    })();

    filtroStatus.addEventListener('change', carregarLista);
    filtroPrioridade.addEventListener('change', carregarLista);
    filtroBusca.addEventListener('input', () => {
      clearTimeout(temporizadorBusca);
      temporizadorBusca = setTimeout(carregarLista, 350);
    });
  </script>
</body>
</html>
